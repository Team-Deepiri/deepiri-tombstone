name: CI - deepiri-tombstone

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

permissions:
  contents: read
  pull-requests: write

jobs:
  ci:
    name: Build and verify
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install system deps
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq \
            curl jq gcc binutils gforth gnucobol gfortran python3 make xz-utils perl bc \
            libcurl4-openssl-dev

      - name: Bootstrap toolchain
        run: bash scripts/bootstrap-toolchain.sh

      - name: Build
        run: make

      - name: Integration verify
        run: bash scripts/verify_all.sh

      - name: Build all stages
        run: make

      - name: Unit test suites
        run: bash tests/run_tests.sh

      - name: Script syntax checks
        run: |
          bash -n scripts/compare-models.sh || true
          bash -n scripts/trend.sh || true
          bash -n scripts/report.sh || true

  lint:
    name: Lint and validate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Validate fixtures
        run: |
          for f in fixtures/*.txt; do
            bash scripts/validate_fixtures.sh "$f"
          done

      - name: Perl syntax
        run: perl -c src/transport/http_fallback.pl

      - name: AWK lint
        run: awk --lint -f src/parse/response.awk /dev/null || true

      - name: Shellcheck scripts
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq shellcheck
          shellcheck scripts/*.sh || true

      - name: Fortran syntax
        run: |
          if command -v gfortran >/dev/null 2>&1; then
            gfortran -fsyntax-only src/score/score.f || true
          fi

      - name: COBOL syntax
        run: |
          if command -v cobc >/dev/null 2>&1; then
            cobc -fsyntax-only src/audit/ledger.cob 2>/dev/null || true
          fi

      - name: Forth syntax
        run: |
          if command -v gforth >/dev/null 2>&1; then
            gforth -e "include src/tokenize/tokenize.fs" -e "bye" /dev/null 2>/dev/null || true
          fi

      - name: Report generation test
        run: |
          # Test report generation with synthetic data
          mkdir -p reports
          echo "run-001|test|hello|world|100|PASS" > reports/audit.ledger
          bash scripts/report.sh text > /dev/null 2>&1 && echo "Report(text): OK" || echo "Report(text): skipped"
          bash scripts/report.sh markdown > /dev/null 2>&1 && echo "Report(md): OK" || echo "Report(md): skipped"
          bash scripts/report.sh html > /dev/null 2>&1 && echo "Report(html): OK" || echo "Report(html): skipped"
