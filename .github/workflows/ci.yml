name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install system deps
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq curl jq gcc gforth gnucobol gfortran python3 make ar xz-utils

      - name: Vendor blang
        run: bash scripts/install-deps.sh

      - name: Build
        run: make

      - name: Integration test
        run: bash scripts/verify_all.sh

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Shellcheck
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq shellcheck
          shellcheck scripts/*.sh || true

      - name: Validate fixtures
        run: bash scripts/validate_fixtures.sh

      - name: Perl syntax
        run: perl -c perl/http_fallback.pl

      - name: AWK syntax
        run: awk --lint -f awk/parse_response.awk /dev/null || true
