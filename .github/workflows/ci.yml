name: CI - deepiri-tombstone

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

permissions:
  contents: read

jobs:
  ci:
    name: Build and verify
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install system deps
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq \
            curl jq gcc binutils gforth gnucobol gfortran python3 make xz-utils perl

      - name: Bootstrap toolchain
        run: bash scripts/bootstrap-toolchain.sh

      - name: Build
        run: make

      - name: Integration verify
        run: bash scripts/verify_all.sh

      - name: Component tests
        run: |
          bash tests/test_parse.sh
          bash tests/test_tokenize.sh
          bash tests/test_score.sh
          bash tests/test_audit.sh
          bash tests/test_build_request.sh

  lint:
    name: Lint and validate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate fixtures
        run: bash scripts/validate_fixtures.sh

      - name: Perl syntax
        run: perl -c src/transport/http_fallback.pl

      - name: AWK lint
        run: awk --lint -f src/parse/response.awk /dev/null || true

      - name: Shellcheck scripts
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq shellcheck
          shellcheck scripts/*.sh || true
