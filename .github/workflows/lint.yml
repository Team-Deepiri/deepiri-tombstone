name: Lint

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Shellcheck
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq shellcheck
          shellcheck scripts/*.sh tests/*.sh

  perl:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Perl syntax
        run: perl -c perl/http_fallback.pl

  awk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: AWK syntax
        run: awk --lint -f awk/parse_response.awk /dev/null || true

  fixtures:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate fixtures
        run: |
          for f in fixtures/*.txt; do
            bash scripts/validate_fixtures.sh "$f"
          done
