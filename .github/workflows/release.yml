name: Release

on:
  push:
    tags: ['v*']

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - name: Install deps
        run: bash scripts/install-deps.sh
      - name: Build
        run: make dist
      - name: Package
        run: |
          tar czf deepiri-tombstone.tar.gz \
            bin/ deepiri-tombstone scripts/ fixtures/ \
            docs/ LICENSE README.md
      - name: Create release
        uses: softprops/action-gh-release@v3
        with:
          files: deepiri-tombstone.tar.gz
          body_path: CHANGELOG.md
