name: Test

on:
  push:
    branches: ['*']
  pull_request:
    branches: ['*']

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        component: [awk, tokenize, score, audit, build-request]
    steps:
      - uses: actions/checkout@v4
      - name: Test ${{ matrix.component }}
        run: bash tests/test_${{ matrix.component }}.sh
